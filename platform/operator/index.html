<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10X · Operator</title><link rel="stylesheet" href="/operator.css"><script type="module" src="/operator.js"></script></head>
<body><main><header><span>10X.MEME</span><h1>Operator console</h1></header>
<p id="feedback" role="status" aria-live="polite"></p>
<form id="login" hidden><h2>Open a local session</h2><label>Startup code<input type="password" name="code" required autocomplete="off"></label><button>Sign in</button></form>
<section id="workspace" hidden>
<div class="toolbar"><label>UTC board date<input type="date" id="day"></label><label>Queue<select id="state" aria-label="Queue"><option value="pending">Pending reviews</option><option value="reviewed">Final decisions</option></select></label><button id="logout">Sign out</button></div>
<section><h2>Review capacity</h2><p id="capacity"></p>
<details><summary>Change staffing</summary><form id="staff">
<label>Minutes available<input name="staffedMinutes" type="number" min="0" max="1440" required></label>
<label>Seconds per review<input name="secondsPerReview" type="number" min="1" max="3600" value="180" required></label>
<label>Admission limit<input name="admissionLimit" type="number" min="0" max="100" value="100" required></label>
<label>Reason<input name="reason" maxlength="256" required></label><button>Apply staffing</button></form></details></section>
<section><h2>Content reviews</h2><div id="queue"></div><button id="next" hidden>Next page</button></section>
</section></main></body></html>
