name: 10X platform validation
on:
  push:
    branches: [work/10x-prd-foundation]
    paths:
      - '.github/workflows/10x-platform-check.yml'
      - 'platform/validation/checkpoint.json'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/10x-platform-check.yml'
permissions:
  contents: read
concurrency:
  group: tenx-platform-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - name: Reference domains, workflows, contracts and local recovery
        working-directory: platform
        run: |
          node scripts/test-reference.mjs
          node contracts/generate.mjs --check
          node earn/recovery-drill.mjs
      - name: Install build tool
        run: npm install --global --ignore-scripts pnpm@10.26.0
      - name: Compile and test the primary viewer
        working-directory: platform/site
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm build
          pnpm test
      - name: Verify frozen beacon fixture offline
        working-directory: platform/beacon
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm test
      - name: Compile and test Workers, D1 and R2 locally
        working-directory: platform/edge
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm typecheck
          pnpm test
