name: Security Checks

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Root typecheck
        run: pnpm typecheck

      - name: Root security preflight
        run: pnpm security:preflight

      - name: Untrusted JSON stream resource and admin guards
        run: pnpm --dir discovery test -- src/bounded-json.test.ts src/request-security.test.ts

      - name: Native isolated JSON stream deadline and cancellation
        run: node scripts/check-bounded-json-runtime.mjs .tmp/ci-bounded-json-runtime

      - name: JSON stream validation tooling types
        run: pnpm exec tsc --noEmit -p tsconfig.stream-guards.json

      - name: Private Discovery archive integrity and path guards
        run: pnpm test:discovery-archives

      - name: Isolated evidence proof runtime and native storage guards
        run: pnpm test:discovery-reference-runtime .tmp/ci-evidence-reference-runtime

      - name: Private full metadata capacity and chronological growth guards
        run: pnpm test:discovery-capacity

      - name: Private scratch resolver and immutable historical replay
        run: pnpm test:discovery-scratch

      - name: Protected evidence key recovery and private path guards
        run: pnpm test:discovery-recovery

      - name: Encrypted private metadata and exact scratch restore
        run: pnpm test:discovery-metadata-sealed

      - name: Scratch replay tooling types
        run: pnpm exec tsc --noEmit -p tsconfig.evidence-scratch.json

      - name: Evidence read contract and encrypted-store parity
        run: pnpm test:discovery-read-store

      - name: Install dependencies (app)
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App typecheck
        working-directory: app
        run: pnpm typecheck

      - name: App security preflight
        working-directory: app
        run: pnpm security:preflight

      - name: Solana RPC dependency contracts
        run: pnpm security:test:solana-rpc

      - name: Signed webhook dependency contracts
        working-directory: app
        run: pnpm test -- functions/webhook.test.ts
