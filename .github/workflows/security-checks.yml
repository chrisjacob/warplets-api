name: Security Checks

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Root typecheck
        run: pnpm typecheck

      - name: Root security preflight
        run: pnpm security:preflight

      - name: Untrusted JSON stream resource and admin guards
        run: pnpm --dir discovery test -- src/bounded-json.test.ts src/request-security.test.ts

      - name: Native isolated JSON stream deadline and cancellation
        run: node scripts/check-bounded-json-runtime.mjs .tmp/ci-bounded-json-runtime

      - name: JSON stream validation tooling types
        run: pnpm exec tsc --noEmit -p tsconfig.stream-guards.json

      - name: Private Discovery archive integrity and path guards
        run: pnpm test:discovery-archives

      - name: Isolated evidence proof runtime and native storage guards
        run: pnpm test:discovery-reference-runtime .tmp/ci-evidence-reference-runtime

      - name: Private full metadata capacity and chronological growth guards
        run: pnpm test:discovery-capacity

      - name: Private scratch resolver and immutable historical replay
        run: pnpm test:discovery-scratch

      - name: Protected evidence key recovery and private path guards
        run: pnpm test:discovery-recovery

      - name: Encrypted private metadata and exact scratch restore
        run: pnpm test:discovery-metadata-sealed

      - name: Scratch replay tooling types
        run: pnpm exec tsc --noEmit -p tsconfig.evidence-scratch.json

      - name: Evidence read contract and encrypted-store parity
        run: pnpm test:discovery-read-store

      - name: Immutable evidence response and activity compatibility
        run: pnpm --dir discovery test -- src/evidence-read-store.test.ts

      - name: Evidence append atomicity, immutable collisions and spent allowances
        run: pnpm --dir discovery test -- src/evidence-write-store.test.ts src/wallet-work.test.ts

      - name: Native isolated D1 evidence append rollback
        run: node scripts/check-evidence-write-runtime.mjs .tmp/ci-evidence-write-runtime

      - name: Evidence append runtime fixture types
        run: pnpm exec tsc --noEmit -p tsconfig.evidence-write.json

      - name: Private encrypted append staging and fault recovery
        run: pnpm test:discovery-append-stage

      - name: Isolated fenced metadata publication and acknowledgement recovery
        run: pnpm test:discovery-publication

      - name: Unified private frozen and published evidence reads
        run: pnpm test:discovery-publication-read

      - name: Original producer batch and encrypted publication compatibility
        run: pnpm test:discovery-producer-batches

      - name: Encrypted publication intents and process restart reconciliation
        run: pnpm test:discovery-intents

      - name: Persist-before-execute producer publication and explicit caller outcomes
        run: pnpm test:discovery-producer-publication

      - name: Original candidate workflow on isolated fenced metadata and encrypted receipts
        run: pnpm test:discovery-candidate-target

      - name: Receipt-free candidate metadata intents and restart recovery
        run: pnpm test:discovery-candidate-metadata

      - name: Isolated original cached-wallet replay and bounded cache/checkpoint reads
        run: pnpm test:discovery-wallet-replay-target

      - name: Isolated cached funding checkpoint and completion publications
        run: pnpm test:discovery-wallet-cached-target

      - name: Isolated spend-before-call wallet and shared RPC quota reservations
        run: pnpm test:discovery-wallet-quota-target

      - name: Integrated original cache-only wallet cycle with lease and recovery
        run: pnpm test:discovery-wallet-cycle-target

      - name: Original funding collection with recorded transport and persisted cache/checkpoints
        run: pnpm test:discovery-wallet-collection-target

      - name: Integrated original recorded direct-funding cycle, catch-up and backoff
        run: pnpm test:discovery-wallet-direct-cycle-target

      - name: Integrated recorded reader recovery with guarded claim and cache adoption
        run: pnpm test:discovery-wallet-recovery-cycle-target
      - name: Isolated recorded wallet snapshot cycle
        run: pnpm test:discovery-wallet-snapshot-cycle-target

      - name: Automatic recorded wallet selection across original stages
        run: pnpm test:discovery-wallet-automatic-cycle-target

      - name: Durable post-commit cohort publication and recovery
        run: pnpm test:discovery-cohort-publication

      - name: Linked candidate and cohort readiness recovery
        run: pnpm test:discovery-candidate-workflow

      - name: Install dependencies (app)
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App typecheck
        working-directory: app
        run: pnpm typecheck

      - name: App security preflight
        working-directory: app
        run: pnpm security:preflight

      - name: Solana RPC dependency contracts
        run: pnpm security:test:solana-rpc

      - name: Signed webhook dependency contracts
        working-directory: app
        run: pnpm test -- functions/webhook.test.ts
