name: 10X captured program parity
on:
  push:
    branches: [work/10x-prd-foundation]
    paths:
      - 'platform/lab/**'
      - 'platform/domain/economics/**'
      - '.github/workflows/10x-platform-parity.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check capture hashes, Kamino account layout and scheduler wire
        run: node --test platform/lab/*.test.mjs
      - name: Check out pinned simulator dependency manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6dc1b72b41fd1fb7f35f9db26ffef8285199c5ef
          path: october-reference
          persist-credentials: false
      - name: Install frozen test dependencies with lifecycle scripts disabled
        working-directory: october-reference
        run: npx --yes pnpm@10.26.0 --filter @10x/meme-qa --filter @10x/meme-protocol-lab install --frozen-lockfile --ignore-scripts
      - name: Replay captured program in offline Surfpool
        run: node platform/lab/replay-capture.mjs october-reference
      - name: Read and pin Kamino ELF from the free public endpoint
        run: node platform/lab/fetch-kamino-replay-elf.mjs "$RUNNER_TEMP/kamino-program.so"
      - name: Replay farm lifecycle in offline Surfpool
        run: node platform/lab/replay-kamino.mjs october-reference "$RUNNER_TEMP/kamino-program.so"
      - name: Pin the public Rewards program deployment
        run: node platform/lab/fetch-rewards-replay-elf.mjs "$RUNNER_TEMP/rewards-program.so"
      - name: Verify Earn vesting and test NFT ownership transfer against the captured distributor
        run: node platform/lab/replay-rewards.mjs october-reference "$RUNNER_TEMP/rewards-program.so"
      - name: Pin the public Core program deployment
        run: node platform/lab/fetch-rewards-replay-elf.mjs "$RUNNER_TEMP/core-program.so" core
      - name: Test transferable Vault claim using real Core and Rewards instructions
        run: node platform/lab/replay-core-vault.mjs october-reference "$RUNNER_TEMP/rewards-program.so" "$RUNNER_TEMP/core-program.so"
