name = "api"
main = "src/index.ts"
account_id = "3f3a7e7d6b29f0389b841af63623becd"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Run the OpenSea event sync every 1 minute.
# Set the API key as a secret: pnpm wrangler secret put OPENSEA_API_KEY
[triggers]
crons = ["* * * * *"]

[vars]
# Optional Dune round-two analytics. This scheduled Worker owns production
# polling/execution because Pages Functions do not receive Cron Trigger events.
# Keep both switches off until the saved queries and their costs are validated.
DUNE_ENABLED = "0"
DUNE_EXECUTE_ENABLED = "0"
DUNE_EXECUTION_INTERVAL_HOURS = "24"
DUNE_RESULTS_PAGE_SIZE = "1000"
DUNE_MAX_RESULT_PAGES = "8"
DUNE_INDEXING_LAG_HOURS = "2"
DUNE_MONTHLY_CREDIT_BUDGET = "1500"
DUNE_MAX_CREDITS_PER_EXECUTION = "20"
# DUNE_TRADES_QUERY_ID = "1234567"
# DUNE_TRANSFERS_QUERY_ID = "1234568"
# DUNE_TRADES_BACKFILL_QUERY_ID = "1234569"
# DUNE_TRANSFERS_BACKFILL_QUERY_ID = "1234570"
# Secret: DUNE_API_KEY


[[routes]]
pattern = "api.10x.meme"
custom_domain = true

# Workers KV — stores aggregated poll totals for fast edge reads.
[[kv_namespaces]]
binding = "WARPLETS_KV"
id = "3f55e9bea2534955b833521a2f5b55e7"

# Cloudflare D1 — durable SQL store for users and individual vote rows.
[[d1_databases]]
binding       = "WARPLETS"
database_name = "warplets"
database_id   = "45a4cc4c-788e-48dd-89bf-7b504b17655d"

[env.dev]
name = "api-dev"
main = "src/index.dev.ts"
routes = []
workers_dev = false

[env.dev.vars]
SNAP_PUBLIC_BASE_URL = "https://api-dev.10x.meme"
DUNE_ENABLED = "0"
DUNE_EXECUTE_ENABLED = "0"
DUNE_EXECUTION_INTERVAL_HOURS = "24"
DUNE_RESULTS_PAGE_SIZE = "1000"
DUNE_MAX_RESULT_PAGES = "8"
DUNE_INDEXING_LAG_HOURS = "2"
DUNE_MONTHLY_CREDIT_BUDGET = "1500"
DUNE_MAX_CREDITS_PER_EXECUTION = "20"

[[env.dev.kv_namespaces]]
binding = "WARPLETS_KV"
id = "635a084da4ba40e99c3289127178c0a8"

[[env.dev.d1_databases]]
binding       = "WARPLETS"
database_name = "warplets_dev"
database_id   = "e828c5a0-ba86-47c4-93ce-1b34d45a50b0"
